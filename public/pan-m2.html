document.getElementById("tog").onclick=function(){const s=document.getElementById("side");
 const c=s.classList.toggle("collapsed");this.textContent=c?"›":"‹";};
const mb=document.getElementById("months");
months.forEach(m=>{const d=document.createElement("div");d.className="mo"+(m===selM?" on":"");d.textContent=m+"월";
 d.onclick=()=>{selM=m;document.querySelectorAll(".mo").forEach((x,i)=>x.classList.toggle("on",months[i]===selM));nav();};mb.appendChild(d);});

document.getElementById("back").onclick=()=>{if(level==="person"){level="team";selTeam=null;}else if(level==="team"){level="sil";selSil=null;}nav();};
function badge(v,thr,eff){if(v==null)return '<span class="na">–</span>';
 let c=v>=thr[1]?"hi":(v>=thr[0]?"mid":"lo"), s=v>=thr[1]?"▲":(v>=thr[0]?"●":"▼");
 return '<span class="b '+c+'">'+s+' '+(eff?v.toFixed(0)+'%':v.toFixed(1))+'</span>';}
function wkVal(e,w){if(view==="est")return e.est[w]??null;if(view==="att")return (e.att||{})[w]??null;
 const ev=e.est[w],av=(e.att||{})[w];return (ev!=null&&av)?100*ev/av:null;}
function moVal(e,m){if(view==="est")return (e.em||{})[m]??null;if(view==="att")return (e.am||{})[m]??null;
 const ev=(e.em||{})[m],av=(e.am||{})[m];return (ev!=null&&av)?100*ev/av:null;}
function goSil(){level="sil";selSil=selTeam=null;nav();}
function goTeam(s){level="team";selSil=s;selTeam=null;nav();}
function goPerson(t){level="person";selTeam=t;nav();}
window.goSil=goSil;window.goTeam=goTeam;window.goPerson=goPerson;
function stateHash(){let p="#/work-hours/"+view+"/"+level+"/m"+selM;
 if(level!=="sil")p+="/s"+encodeURIComponent(selSil);
 if(level==="person")p+="/t"+encodeURIComponent(selTeam);return p;}
function nav(){history.pushState(null,"",stateHash());render();}
function applyHash(){const raw=location.hash;if(raw.indexOf("/work-hours/")<0)return false;
 const seg=raw.replace(/^#\//,"").split("/");view=seg[1]||"est";level=seg[2]||"sil";selSil=selTeam=null;
 for(let i=3;i<seg.length;i++){const s=seg[i];if(s[0]==="m")selM=Number(s.slice(1));
  else if(s[0]==="s")selSil=decodeURIComponent(s.slice(1));else if(s[0]==="t")selTeam=decodeURIComponent(s.slice(1));}
 document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.v===view));
 document.querySelectorAll(".mo").forEach((x,i)=>x.classList.toggle("on",months[i]===selM));return true;}
window.onpopstate=()=>{applyHash();render();};
function ents(){
 if(level==="sil")return D.sils.map(s=>({k:s.실,lab:s.실,sub:s.인원+"명",est:s.est,att:s.att,em:s.em,am:s.am,인원:s.인원,drill:"goTeam('"+s.실+"')"}));
 if(level==="team")return D.sils.find(s=>s.실===selSil).teams.map(d=>{const t=D.teams[d];

}

 } else { pn.style.display="none"; }

}
