<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAN HR — 통합 대시보드</title>
<style>
/* ===== 디자인 가이드 토큰 (design_guide_260527/tokens.css) ===== */
:root{
  --dh-brand-50:#F0F6FA;--dh-brand-100:#E1EDF4;--dh-brand-200:#CBDFE9;--dh-brand-300:#B4D3E4;--dh-brand-400:#87B8D3;
  --dh-brand-500:#4A95BC;--dh-brand-600:#066FA5;--dh-brand-700:#055A86;--dh-brand-800:#044466;--dh-brand-900:#022E47;
  --dh-ink-50:#F8FAFC;--dh-ink-100:#F1F5F9;--dh-ink-200:#E2E8F0;--dh-ink-300:#CBD5E1;--dh-ink-400:#94A3B8;
  --dh-ink-500:#64748B;--dh-ink-600:#475569;--dh-ink-700:#334155;--dh-ink-800:#1E293B;--dh-ink-900:#0F172A;
  --dh-surface-sidebar:var(--dh-brand-100);
  /* CEO 실측: 헤더 52px · 사이드바 clamp(196,18vw,270)/58 (constants.ts) */
  --hdr-h:52px;--sb-w:clamp(196px,18vw,270px);--sb-w-col:58px;--r:4px;
  --font:'Inter','NanumBarunGothic','Nanum Barun Gothic','Malgun Gothic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);letter-spacing:-.01em;color:var(--dh-ink-900);background:#fff;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ===== 상단 헤더 (CEO AppHeader · 52px) ===== */
.topbar{height:var(--hdr-h);flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:#fff;border-bottom:1px solid var(--dh-ink-200)}
.topbar .brand{font-size:16px;font-weight:700;color:var(--dh-brand-700);letter-spacing:-.02em;white-space:nowrap}
.topbar .crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dh-ink-500);min-width:0}
.topbar .crumb .sep{color:var(--dh-ink-300)}
.topbar .crumb .cur{color:var(--dh-ink-700);font-weight:600}
.topbar .sp{flex:1}
.topbar .dashid{display:inline-flex;align-items:center;background:#F6F7F9;border:1px solid #EEF1F4;color:#9AA1B4;
  font-size:10px;font-weight:700;letter-spacing:.02em;border-radius:var(--r);padding:4px 9px;white-space:nowrap;
  font-family:'Segoe UI','Malgun Gothic',Arial,sans-serif}
.topbar .dashid:empty{display:none}

/* ===== 본문 행 ===== */
.body{flex:1;min-height:0;display:flex}

/* ===== 사이드바 (CEO TaxonomySidebar) ===== */
.sb{width:var(--sb-w);flex:none;background:var(--dh-surface-sidebar);border-right:1px solid var(--dh-ink-200);
  display:flex;flex-direction:column;transition:width .2s cubic-bezier(.2,.8,.2,1)}
.app.col .sb{width:var(--sb-w-col)}
.sb .sbtop{height:38px;flex:none;display:flex;align-items:center;justify-content:flex-end;padding:0 10px;
  border-bottom:1px solid var(--dh-brand-200)}
.tog{width:26px;height:26px;flex:none;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--dh-ink-300);background:#fff;color:var(--dh-ink-600);border-radius:var(--r);
  cursor:pointer;font-size:13px;line-height:1;transition:color .12s,border-color .12s}
.tog:hover{color:var(--dh-brand-600);border-color:var(--dh-brand-400)}

.nav{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 0}
.mitem>.mbtn{width:100%;display:flex;align-items:center;gap:9px;background:transparent;cursor:pointer;
  text-align:left;padding:9px 12px;border:0;border-left:2px solid transparent;font-family:inherit;
  font-size:13px;line-height:20px;font-weight:500;color:var(--dh-ink-700);
  transition:color .12s,background-color .12s,border-color .12s}
.mitem>.mbtn:hover{color:var(--dh-brand-600)}
.mitem.on>.mbtn{color:var(--dh-brand-600);background:var(--dh-surface-card,#fff);border-left-color:var(--dh-brand-600)}
.mitem>.mbtn .mico{flex:none;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:inherit}
.mitem>.mbtn .mico svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mitem>.mbtn .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem>.mbtn .car{flex:none;font-size:8px;color:var(--dh-ink-400);transition:transform .15s}
.mitem.open>.mbtn .car{transform:rotate(90deg)}
.app.col .mitem>.mbtn{justify-content:center;padding:9px 0}
.app.col .mitem>.mbtn .lbl,.app.col .mitem>.mbtn .car{display:none}

.subs{display:none;flex-direction:column;padding:2px 0 6px}
.mitem.open .subs{display:flex}
.app.col .subs{display:none!important}
.subs .sbtn{display:block;width:100%;text-align:left;background:transparent;cursor:pointer;font-family:inherit;
  font-size:12px;line-height:16px;color:var(--dh-ink-600);font-weight:400;padding:5px 8px 5px 33px;
  border:0;border-left:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color .12s,background-color .12s,border-color .12s}
.subs .sbtn:hover{color:var(--dh-brand-600)}
.subs .sbtn.on{color:var(--dh-brand-600);background:var(--dh-surface-card,#fff);border-left-color:var(--dh-brand-600);font-weight:600}
.subs .empty{font-size:11px;color:var(--dh-ink-400);padding:5px 8px 5px 33px}

.foot{flex:none;padding:11px 14px;border-top:1px solid var(--dh-brand-200);font-size:10.5px;color:var(--dh-ink-500);line-height:1.6}
.app.col .foot{display:none}

/* ===== 본문(대시보드) ===== */
.frameWrap{flex:1;min-width:0;min-height:0;background:#fff}
iframe{width:100%;height:100%;border:0;display:block}
</style></head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <span class="brand">PAN HR</span>
    <nav class="crumb" id="crumb" aria-label="경로"></nav>
    <span class="sp"></span>
    <span class="dashid" id="dashid"></span>
  </div>
  <div class="body">
    <aside class="sb">
      <div class="sbtop"><button class="tog" id="tog" title="사이드바 접기/펼치기" onclick="toggleCol()">&#8249;</button></div>
      <nav class="nav" id="nav"></nav>
      <div class="foot">인력·조직 통합 대시보드<br>K사 · OOO · 2026</div>
    </aside>
    <div class="frameWrap"><iframe id="frame" title="dashboard"></iframe></div>
  </div>
</div>
<script>
// 각 대시보드의 "자체 사이드바"를 그대로 미러링한다. (대시보드가 ?embed=1 일 때 postMessage 로 메뉴/활성 보고)
const MENU=[
 {id:'M0', label:'M0 인력계획',  src:'M0_대시보드_mockup_masked.html',        mode:'scan'},
 {id:'M1', label:'M1 인력동인',  src:'M1_대시보드_mockup_masked.html',        mode:'scan'},
 {id:'M2', label:'M2 근무 적정성',  src:'M2_근무추정시간_대시보드_masked.html',  mode:'single', subs:[{i:0,label:'근무추정시간 대시보드'}]},
 {id:'M3', label:'M3 Skill 관리', src:'M3_Skill_대시보드_26_masked.html',       mode:'scan'},
 {id:'M4', label:'M4 직무업무 가치', src:'M4_v2_dashboard.html',         mode:'scan'},
];
// CEO-Agent 사이드바처럼 메뉴 앞에 lucide 아이콘 (숫자 대신)
const ICONS={
 M0:'<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
 M1:'<svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
 M2:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>',
 M3:'<svg viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 2.5 9 2.5 12 0v-5"/></svg>',
 M4:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
};
const SUBS={}, ACTSUB={};
let CUR=null;
const frame=document.getElementById('frame');
const nav=document.getElementById('nav');

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function renderNav(){
  nav.innerHTML=MENU.map(m=>{
    const open=(CUR===m.id);
    const subs=(m.mode==='single'?m.subs:SUBS[m.id])||null;
    let subHtml='';
    if(open){
      if(!subs) subHtml='<div class="subs"><span class="empty">메뉴 불러오는 중…</span></div>';
      else if(subs.length===0) subHtml='<div class="subs"><span class="empty">하위 메뉴 없음</span></div>';
      else subHtml='<div class="subs">'+subs.map((s,i)=>
        `<button class="sbtn${ACTSUB[m.id]===i?' on':''}" onclick="subClick('${m.id}',${i})">${esc(s.label)}</button>`).join('')+'</div>';
    }
    return `<div class="mitem${open?' on open':''}" id="mi-${m.id}">
      <button class="mbtn" onclick="pick('${m.id}')" title="${esc(m.label)}">
        <span class="mico">${ICONS[m.id]||''}</span><span class="lbl">${esc(m.label)}</span><span class="car">&#9654;</span>
      </button>${subHtml}</div>`;
  }).join('');
}

function updateCrumb(){
  const m=MENU.find(x=>x.id===CUR); if(!m){document.getElementById('crumb').innerHTML='';return;}
  const subs=(m.mode==='single'?m.subs:SUBS[m.id])||[];
  const cur=subs[ACTSUB[m.id]||0];
  let h='<span class="cur">'+esc(m.label)+'</span>';
  if(cur) h+='<span class="sep">/</span><span class="cur">'+esc(cur.label)+'</span>';
  document.getElementById('crumb').innerHTML=h;
}

function pick(id){
  const m=MENU.find(x=>x.id===id);
  if(CUR!==id){
    CUR=id; ACTSUB[id]=0;
    document.getElementById('dashid').textContent='';
    frame.src=m.src+'?embed=1';
    if(m.mode==='single') SUBS[id]=m.subs;
  }
  renderNav(); updateCrumb();
}

function subClick(id,i){
  if(CUR!==id){ pick(id); }
  ACTSUB[id]=i;
  renderNav(); updateCrumb();
  try{ frame.contentWindow.postMessage({pan:'go', i:i}, '*'); }catch(_){}
}

// 대시보드 → 포털: 자체 사이드바 메뉴 보고 + 활성 항목 동기화
window.addEventListener('message',function(e){
  const d=e.data||{};
  const m=MENU.find(x=>x.id===CUR);
  if(d.pan==='menu' && Array.isArray(d.items)){
    if(m && m.mode==='scan'){
      SUBS[CUR]=d.items;
      if(ACTSUB[CUR]==null) ACTSUB[CUR]=0;
      renderNav(); updateCrumb();
    }
  }
  else if(d.pan==='active' && typeof d.i==='number'){
    if(m && m.mode!=='single'){ ACTSUB[CUR]=d.i; renderNav(); updateCrumb(); }
  }
  else if(d.pan==='badge'){
    document.getElementById('dashid').textContent=d.text||'';
  }
});

frame.addEventListener('load',function(){
  setTimeout(()=>{ try{ frame.contentWindow.postMessage({pan:'rescan'}, '*'); }catch(_){} }, 200);
});

function toggleCol(){
  const app=document.getElementById('app');
  app.classList.toggle('col');
  document.getElementById('tog').innerHTML = app.classList.contains('col') ? '&#8250;' : '&#8249;';
}

renderNav();
pick('M0');
</script>
</body></html>
